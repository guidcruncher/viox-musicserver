{
    name = libpipewire-module-adapter
    args = {
        factory.name = "adapter"
        node.name = "dsp-to-raw"
        node.description = "DSP to RAW Adapter"
        media.class = "Audio/Source"

        # Input: DSP from EQ
        capture.props = {
            node.name = "dsp-output"
        }

        # Output: RAW PCM for sinks
        playback.props = {
            audio.format = "$AUDIO_FORMAT"
            audio.rate = $AUDIO_RATE
            audio.channels = $AUDIO_CHANNELS
            audio.position = "$AUDIO_POSITION"
        }
    }
}

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Biquad Parametric EQ"
            media.name       = "Biquad Parametric EQ"

            filter.graph = {
                nodes = [
                    {
                        name  = "band1"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 63.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band2"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 125.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band3"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 250.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band4"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 500.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band5"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 1000.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band6"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 2000.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band7"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 4000.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                    {
                        name  = "band8"
                        type  = builtin
                        label = "biquad"
                        control = {
                            type = "peaking"
                            freq = 8000.0
                            q    = 1.0
                            gain = 0.0
                        }
                    }
                ]

                links = [
                    { output = "band1:Out" input = "band2:In" }
                    { output = "band2:Out" input = "band3:In" }
                    { output = "band3:Out" input = "band4:In" }
                    { output = "band4:Out" input = "band5:In" }
                    { output = "band5:Out" input = "band6:In" }
                    { output = "band6:Out" input = "band7:In" }
                    { output = "band7:Out" input = "band8:In" }
                ]
            }

            capture.props = {
                node.name       = "dsp-input"
                media.class     = "Audio/Source"
                audio.format    = "$AUDIO_FORMAT"
                audio.rate      = $AUDIO_RATE
                audio.channels  = $AUDIO_CHANNELS
                audio.position  = "$AUDIO_POSITION"
            }

            playback.props = {
                node.name        = "dsp-output"
                node.passive     = true
                node.autoconnect = true
                media.class      = "Audio/Sink"
                audio.format     = "$AUDIO_FORMAT"
                audio.rate       = $AUDIO_RATE
                audio.channels   = $AUDIO_CHANNELS
                audio.position   = "$AUDIO_POSITION"
            }
        }
    }
]
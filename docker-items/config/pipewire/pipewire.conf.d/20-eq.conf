context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "LSP Parametric EQ (LV2)"
            media.name       = "LSP Parametric EQ (LV2)"

            filter.graph = {
                nodes = [
                    {
                        type  = lv2
                        name  = "eq_node"
                        plugin = "http://lsp-plug.in/plugins/lv2/para-equalizer-x8-stereo"

                        control = {
                            "Band 1 Frequency" = 63.0
                            "Band 1 Gain"      = 0.0
                            "Band 1 Q"         = 1.0

                            "Band 2 Frequency" = 125.0
                            "Band 2 Gain"      = 0.0
                            "Band 2 Q"         = 1.0

                            "Band 3 Frequency" = 250.0
                            "Band 3 Gain"      = 0.0
                            "Band 3 Q"         = 1.0

                            "Band 4 Frequency" = 500.0
                            "Band 4 Gain"      = 0.0
                            "Band 4 Q"         = 1.0

                            "Band 5 Frequency" = 1000.0
                            "Band 5 Gain"      = 0.0
                            "Band 5 Q"         = 1.0

                            "Band 6 Frequency" = 2000.0
                            "Band 6 Gain"      = 0.0
                            "Band 6 Q"         = 1.0

                            "Band 7 Frequency" = 4000.0
                            "Band 7 Gain"      = 0.0
                            "Band 7 Q"         = 1.0

                            "Band 8 Frequency" = 8000.0
                            "Band 8 Gain"      = 0.0
                            "Band 8 Q"         = 1.0
                        }
                    }
                ]
            }

            capture.props = {
                node.name       = "dsp-input"
                media.class     = "Audio/Source"
                audio.format    = "$AUDIO_FORMAT"
                audio.rate      = $AUDIO_RATE
                audio.channels  = $AUDIO_CHANNELS
                audio.position  = "$AUDIO_POSITION"
            }

            playback.props = {
                node.name        = "dsp-output"
                node.passive     = true
                node.autoconnect = true
                media.class      = "Audio/Sink"
                audio.format     = "$AUDIO_FORMAT"
                audio.rate       = $AUDIO_RATE
                audio.channels   = $AUDIO_CHANNELS
                audio.position   = "$AUDIO_POSITION"
            }
        }
    }
]

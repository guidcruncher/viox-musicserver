context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "LSP Parametric EQ"
            media.name       = "LSP Parametric EQ"

            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = "eq_node"
                        plugin = "/usr/lib/ladspa/lsp-plugins-ladspa.so"
                        label  = "lsp_par_eq_8"

                        control = {
                            "Band 1 Freq" = 63.0
                            "Band 1 Gain" = 0.0
                            "Band 1 Q"    = 1.0

                            "Band 2 Freq" = 125.0
                            "Band 2 Gain" = 0.0
                            "Band 2 Q"    = 1.0

                            "Band 3 Freq" = 250.0
                            "Band 3 Gain" = 0.0
                            "Band 3 Q"    = 1.0

                            "Band 4 Freq" = 500.0
                            "Band 4 Gain" = 0.0
                            "Band 4 Q"    = 1.0

                            "Band 5 Freq" = 1000.0
                            "Band 5 Gain" = 0.0
                            "Band 5 Q"    = 1.0

                            "Band 6 Freq" = 2000.0
                            "Band 6 Gain" = 0.0
                            "Band 6 Q"    = 1.0

                            "Band 7 Freq" = 4000.0
                            "Band 7 Gain" = 0.0
                            "Band 7 Q"    = 1.0

                            "Band 8 Freq" = 8000.0
                            "Band 8 Gain" = 0.0
                            "Band 8 Q"    = 1.0
                        }
                    }
                ]
            }

            capture.props = {
                node.name       = "dsp-input"
                media.class     = "Audio/Sink"
                audio.format    = "$AUDIO_FORMAT"
                audio.rate      = $AUDIO_RATE
                audio.channels  = $AUDIO_CHANNELS
                audio.position  = "$AUDIO_POSITION"
            }

            playback.props = {
                node.name        = "dsp-output"
                node.passive     = true
                node.autoconnect = true
                audio.format     = "$AUDIO_FORMAT"
                audio.rate       = $AUDIO_RATE
                audio.channels   = $AUDIO_CHANNELS
                audio.position   = "$AUDIO_POSITION"
            }
        }
    }
]

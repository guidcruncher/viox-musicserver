context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "LADSPA Equalizer"
            media.name       = "LADSPA Equalizer"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = "eq_node"
                        plugin = "/usr/lib/ladspa/caps.so"
                        label  = "Eq10X2"
                        control = {
                            "31 Hz"  = 0.0, "63 Hz"  = 0.0, "125 Hz" = 0.0
                            "250 Hz" = 0.0, "500 Hz" = 0.0, "1 kHz"  = 0.0
                            "2 kHz"  = 0.0, "4 kHz"  = 0.0, "8 kHz"  = 0.0
                            "16 kHz" = 0.0
                        }
                    }
                ]
                # No links needed for a single-node graph
            }
            capture.props = {
                node.name        = "dsp-input"
                media.class      = "Audio/Sink"
                audio.format = "$AUDIO_FORMAT"
                audio.rate = $AUDIO_RATE
                audio.channels = $AUDIO_CHANNELS
                audio.position = "$AUDIO_POSITION"
            }
            playback.props = {
                audio.format = "$AUDIO_FORMAT"
                audio.rate = $AUDIO_RATE
                audio.channels = $AUDIO_CHANNELS
                audio.position = "$AUDIO_POSITION"
                node.name        = "dsp-output"
                node.passive     = true
                node.autoconnect = true
            }
        }
    }
]
